databases:
  - name: globalorators-db
    databaseName: globalorators
    user: globalorators_user
    plan: starter
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: globalorators-backend
    env: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: globalorators-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: COACH_INVITE_CODE
        generateValue: true
      - key: DEFAULT_COACH_PASSWORD
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_GATEWAY_URL
        sync: false
      - key: AI_GATEWAY_TOKEN
        sync: false
